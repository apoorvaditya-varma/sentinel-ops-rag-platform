{% for label, items in history %}
<div class="history-group">
  <h3>{{ label }}</h3>
  <ul>
    {% for c in items %}
    <li class="{{ 'active' if c.id == conversation_id else '' }}">
      <a href="/c/{{ c.id }}" title="{{ c.title }}">{{ c.title }}</a>
      <button class="icon-btn icon-btn-small" type="button" aria-label="Delete conversation"
              hx-delete="/c/{{ c.id }}?current={{ conversation_id or '' }}"
              hx-target="#history" hx-swap="innerHTML"
              hx-confirm="Delete this conversation? This can't be undone.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </li>
    {% endfor %}
  </ul>
</div>
{% else %}
<p class="muted small history-empty">Your conversations will appear here.</p>
{% endfor %}
