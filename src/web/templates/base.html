<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script>
    /* Apply the saved theme before first paint to avoid a light/dark flash. */
    (function () {
      var theme = "system", font = "modern", size = "normal";
      try {
        theme = localStorage.getItem("theme") || "system";
        font = localStorage.getItem("font") || "modern";
        size = localStorage.getItem("size") || "normal";
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.font = font;
      document.documentElement.dataset.size = size;
    })();
  </script>
  <link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
  <script src="{{ asset('vendor/htmx.min.js') }}" defer></script>
  <script src="{{ asset('js/app.js') }}" defer></script>
</head>
<body class="page-{{ page }}">
  <header class="topbar">
    {% if page == "ask" %}
    <button class="icon-btn sidebar-toggle" type="button" data-action="toggle-sidebar" aria-label="Show conversations">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    {% endif %}
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
      <span>{{ app_name }}</span>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="/" {% if page == "ask" %}aria-current="page"{% endif %}>Ask</a>
      <a href="/documents" {% if page == "documents" %}aria-current="page"{% endif %}>Documents</a>
      <a href="/settings" {% if page == "settings" %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    <div class="topbar-right">
      {% if ai_enabled() %}
      <span class="pill pill-ok" title="AI-written answers are enabled">AI answers on</span>
      {% else %}
      <a class="pill pill-muted" href="/settings#ai" title="Showing matching passages only. Turn on AI answers and set a key in Settings.">AI answers off</a>
      {% endif %}
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-set="light" title="Light theme" aria-label="Light theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" data-theme-set="system" title="Match my computer's setting" aria-label="System theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        </button>
        <button type="button" data-theme-set="dark" title="Dark theme" aria-label="Dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="flash" class="flash-area" aria-live="polite"></div>

  {% block body %}{% endblock %}
</body>
</html>
