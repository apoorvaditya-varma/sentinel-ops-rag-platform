<rect x="960" y="388" width="270" height="46" rx="8" fill="#fdecec" stroke="#dc2626" stroke-width="1.5"/>
<text x="1095.0" y="407" class="t" font-size="14">DuckDB sandbox</text>
<text x="1095.0" y="424" class="s">SELECT-only · no file/network</text>
<rect x="670" y="524" width="560" height="46" rx="8" fill="#f3edfc" stroke="#7c3aed" stroke-width="1.5"/>
<text x="950.0" y="543" class="t" font-size="14">Answer Writer  (strong LLM)</text>
<text x="950.0" y="560" class="s">only from findings · cites [S#] passages and [T#] query results</text>
<rect x="670" y="590" width="560" height="46" rx="8" fill="#fdecec" stroke="#dc2626" stroke-width="1.5"/>
