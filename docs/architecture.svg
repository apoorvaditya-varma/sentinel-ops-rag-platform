<text x="640.0" y="34" class="t" font-size="22">Sentinel Ops RAG Platform — Architecture</text>
<rect x="20" y="52" width="1240" height="840" rx="12" fill="none" stroke="#9ca3af" stroke-dasharray="8,6"/>
<text x="36" y="72" class="hs">LOCAL MACHINE (no Docker, no servers)</text>
<rect x="40" y="86" width="150" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="115.0" y="105" class="t" font-size="14">User</text>
<text x="115.0" y="122" class="s">browser</text>
<rect x="240" y="86" width="1000" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="740.0" y="105" class="t" font-size="14">Web UI + REST API  (FastAPI · Jinja · HTMX)</text>
<text x="740.0" y="122" class="s">Ask with history  ·  Documents  ·  Settings  ·  light / dark themes  ·  /api/* + OpenAPI docs</text>
<path d="M190,116 L240,116" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="330" y="176" class="h">INGESTION PATH (Tasks 3-5, 9)</text>
<text x="950" y="176" class="h">QUERY PATH (Tasks 6-9)</text>
<rect x="50" y="190" width="560" height="46" rx="8" fill="#fdecec" stroke="#dc2626" stroke-width="1.5"/>
<text x="330.0" y="209" class="t" font-size="14">1  File-type guardrail</text>
<text x="330.0" y="226" class="s">allow-list · magic bytes · macro / zip-bomb / double-extension · size</text>
<rect x="50" y="256" width="560" height="46" rx="8" fill="#e8f1fb" stroke="#2563eb" stroke-width="1.5"/>
<text x="330.0" y="275" class="t" font-size="14">2  Quarantine staging</text>
<text x="330.0" y="292" class="s">data/uploads/.staging — nothing reaches the index unscreened</text>
<rect x="50" y="322" width="560" height="46" rx="8" fill="#e8f1fb" stroke="#2563eb" stroke-width="1.5"/>
<text x="330.0" y="341" class="t" font-size="14">3  Parse (loaders)</text>
<text x="330.0" y="358" class="s">PDF · DOCX · TXT · MD · LOG · CSV · XLSX · JSON · YAML</text>
<rect x="50" y="388" width="560" height="46" rx="8" fill="#fdecec" stroke="#dc2626" stroke-width="1.5"/>
<text x="330.0" y="407" class="t" font-size="14">4  Content scan</text>
<text x="330.0" y="424" class="s">secrets (keys, tokens, passwords) · prompt injection · duplicates</text>
<rect x="50" y="454" width="560" height="46" rx="8" fill="#fdecec" stroke="#dc2626" stroke-width="1.5"/>
<text x="330.0" y="473" class="t" font-size="14">5  Domain relevance</text>
<text x="330.0" y="490" class="s">local embedding margin vs off-topic  →  fast LLM only if borderline</text>
