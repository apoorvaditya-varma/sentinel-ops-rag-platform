# Retrieval golden set over data/sample_docs.
# A query counts as a hit at rank k when one of the top-k chunks contains
# `answer` (case- and whitespace-insensitive), i.e. the passage that actually
# answers the question was retrieved, not just the right file.
# `kind`: paraphrase = wording differs from the document; exact = relies on an
# identifier (CVE, deploy ID, technique ID) that dense embeddings tend to blur.

